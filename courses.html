<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CodeCraftHub: Your Learning Management Platform</title>
    <style>
      :root {
        --primary: #8B5CF6;
        --primary-dark: #7C3AED;
        --primary-light: #EDE9FE;
        --success: #F59E0B;
        --success-dark: #D97706;
        --success-light: #FEF3C7;
        --danger: #EF4444;
        --danger-dark: #DC2626;
        --danger-light: #FEE2E2;
        --gray-50: #F9FAFB;
        --gray-100: #F3F4F6;
        --gray-200: #E5E7EB;
        --gray-400: #9CA3AF;
        --gray-500: #6B7280;
        --gray-700: #374151;
        --gray-900: #111827;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background: var(--gray-50);
        color: var(--gray-900);
        line-height: 1.5;
      }

      .app {
        max-width: 1100px;
        margin: 0 auto;
        padding: 24px 20px 64px;
      }

      .header {
        text-align: center;
        padding: 32px 16px;
        background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
        border-radius: 16px;
        color: #fff;
        margin-bottom: 24px;
      }

      .header h1 {
        margin: 0 0 8px;
        font-size: 1.9rem;
        line-height: 1.2;
        font-weight: 700;
      }

      .header p {
        margin: 0;
        font-size: 1rem;
        opacity: 0.9;
        font-weight: 400;
      }

      .banner {
        padding: 14px 18px;
        border-radius: 10px;
        margin-bottom: 20px;
        font-weight: 500;
        font-size: 0.95rem;
      }

      .banner.success {
        background: var(--success-light);
        color: var(--success-dark);
        border: 1px solid var(--success);
      }

      .banner.error {
        background: var(--danger-light);
        color: var(--danger-dark);
        border: 1px solid var(--danger);
      }

      .hidden {
        display: none !important;
      }

      .card {
        background: #fff;
        border: 1px solid var(--gray-200);
        border-radius: 14px;
        padding: 24px;
      }

      .add-course-card {
        margin-bottom: 32px;
      }

      .add-course-card h2,
      .section-header h2 {
        margin: 0 0 16px;
        font-size: 1.25rem;
        font-weight: 600;
      }

      .form-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
      }

      .form-group {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .form-group.full {
        grid-column: 1 / -1;
      }

      label {
        font-size: 0.85rem;
        font-weight: 600;
        color: var(--gray-700);
      }

      input,
      textarea,
      select {
        font-family: inherit;
        font-size: 0.95rem;
        padding: 10px 12px;
        border: 1px solid var(--gray-200);
        border-radius: 8px;
        background: #fff;
        color: var(--gray-900);
        width: 100%;
      }

      input:focus,
      textarea:focus,
      select:focus {
        outline: none;
        border-color: var(--primary);
        box-shadow: 0 0 0 3px var(--primary-light);
      }

      textarea {
        resize: vertical;
      }

      .field-error {
        min-height: 16px;
        font-size: 0.8rem;
        color: var(--danger-dark);
      }

      .btn {
        font-family: inherit;
        font-size: 0.95rem;
        font-weight: 600;
        padding: 10px 20px;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        transition: transform 0.1s ease, opacity 0.15s ease;
      }

      .btn:active {
        transform: scale(0.97);
      }

      .btn:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }

      .btn-primary {
        background: var(--primary);
        color: #fff;
        margin-top: 18px;
      }

      .btn-primary:hover:not(:disabled) {
        background: var(--primary-dark);
      }

      .btn-secondary {
        background: var(--gray-100);
        color: var(--gray-700);
      }

      .btn-secondary:hover:not(:disabled) {
        background: var(--gray-200);
      }

      .btn-danger {
        background: var(--danger);
        color: #fff;
      }

      .btn-danger:hover:not(:disabled) {
        background: var(--danger-dark);
      }

      .section-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 16px;
      }

      .spinner-wrap {
        display: flex;
        justify-content: center;
        padding: 40px 0;
      }

      .spinner {
        width: 36px;
        height: 36px;
        border: 4px solid var(--primary-light);
        border-top-color: var(--primary);
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      .empty-state {
        text-align: center;
        padding: 48px 16px;
        color: var(--gray-500);
        background: #fff;
        border: 1px dashed var(--gray-200);
        border-radius: 14px;
      }

      .courses-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
        gap: 18px;
      }

      .course-card {
        background: #fff;
        border: 1px solid var(--gray-200);
        border-radius: 14px;
        padding: 20px;
        display: flex;
        flex-direction: column;
        gap: 10px;
        transition: box-shadow 0.2s ease, transform 0.2s ease;
      }

      .course-card:hover {
        box-shadow: 0 8px 20px rgba(17, 24, 39, 0.08);
        transform: translateY(-2px);
      }

      .course-card-top {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 8px;
      }

      .course-name {
        font-size: 1.1rem;
        font-weight: 700;
        margin: 0;
      }

      .status-badge {
        font-size: 0.75rem;
        font-weight: 700;
        padding: 4px 10px;
        border-radius: 999px;
        white-space: nowrap;
      }

      .status-not-started {
        background: var(--gray-100);
        color: var(--gray-700);
      }

      .status-in-progress {
        background: var(--primary-light);
        color: var(--primary-dark);
      }

      .status-completed {
        background: var(--success-light);
        color: var(--success-dark);
      }

      .course-description {
        color: var(--gray-700);
        font-size: 0.9rem;
        margin: 0;
        white-space: pre-wrap;
      }

      .course-meta {
        font-size: 0.8rem;
        color: var(--gray-500);
        display: flex;
        flex-direction: column;
        gap: 2px;
      }

      .course-actions {
        display: flex;
        gap: 10px;
        margin-top: 8px;
      }

      .course-actions .btn {
        flex: 1;
        padding: 8px 14px;
        font-size: 0.85rem;
      }

      .modal-overlay {
        position: fixed;
        inset: 0;
        background: rgba(17, 24, 39, 0.5);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
        z-index: 100;
      }

      .modal {
        background: #fff;
        border-radius: 14px;
        padding: 24px;
        width: 100%;
        max-width: 520px;
        max-height: 90vh;
        overflow-y: auto;
      }

      .modal h2 {
        margin: 0 0 16px;
        font-size: 1.2rem;
        font-weight: 600;
      }

      .modal-actions {
        display: flex;
        justify-content: flex-end;
        gap: 10px;
        margin-top: 20px;
      }

      @media (max-width: 640px) {
        .form-grid {
          grid-template-columns: 1fr;
        }

        .header h1 {
          font-size: 1.5rem;
        }

        .course-actions {
          flex-direction: column;
        }
      }
    </style>
    <meta property="og:image" content="https://bolt.new/static/og_default.png">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:image" content="https://bolt.new/static/og_default.png">
</head>
  <body>
    <div class="app">
      <header class="header">
        <h1>CodeCraftHub: Your Learning Management Platform</h1>
        <p>Track and manage your courses in one place</p>
      </header>

      <div id="banner" class="banner hidden" role="alert"></div>

      <section class="add-course-card card">
        <h2>Add New Course</h2>
        <form id="course-form" novalidate>
          <div class="form-grid">
            <div class="form-group">
              <label for="name">Course Name *</label>
              <input type="text" id="name" placeholder="e.g. Introduction to Python" />
              <span class="field-error" id="name-error"></span>
            </div>
            <div class="form-group">
              <label for="target_date">Target Date *</label>
              <input type="date" id="target_date" />
              <span class="field-error" id="target_date-error"></span>
            </div>
            <div class="form-group full">
              <label for="description">Description *</label>
              <textarea id="description" rows="3" placeholder="What will this course cover?"></textarea>
              <span class="field-error" id="description-error"></span>
            </div>
            <div class="form-group">
              <label for="status">Status *</label>
              <select id="status">
                <option value="Not Started">Not Started</option>
                <option value="In Progress">In Progress</option>
                <option value="Completed">Completed</option>
              </select>
            </div>
          </div>
          <button type="submit" class="btn btn-primary" id="submit-btn">Add Course</button>
        </form>
      </section>

      <section class="courses-section">
        <div class="section-header">
          <h2>Courses</h2>
          <button class="btn btn-secondary" id="refresh-btn">Refresh</button>
        </div>
        <div id="loading" class="spinner-wrap hidden"><div class="spinner"></div></div>
        <div id="empty-state" class="empty-state hidden">No courses yet. Add your first course above.</div>
        <div id="courses-grid" class="courses-grid"></div>
      </section>
    </div>

    <div id="edit-modal" class="modal-overlay hidden">
      <div class="modal">
        <h2>Edit Course</h2>
        <form id="edit-form" novalidate>
          <input type="hidden" id="edit-id" />
          <div class="form-group">
            <label for="edit-name">Course Name *</label>
            <input type="text" id="edit-name" />
            <span class="field-error" id="edit-name-error"></span>
          </div>
          <div class="form-group">
            <label for="edit-target_date">Target Date *</label>
            <input type="date" id="edit-target_date" />
            <span class="field-error" id="edit-target_date-error"></span>
          </div>
          <div class="form-group">
            <label for="edit-description">Description *</label>
            <textarea id="edit-description" rows="3"></textarea>
            <span class="field-error" id="edit-description-error"></span>
          </div>
          <div class="form-group">
            <label for="edit-status">Status *</label>
            <select id="edit-status">
              <option value="Not Started">Not Started</option>
              <option value="In Progress">In Progress</option>
              <option value="Completed">Completed</option>
            </select>
          </div>
          <div class="modal-actions">
            <button type="button" class="btn btn-secondary" id="cancel-edit-btn">Cancel</button>
            <button type="submit" class="btn btn-primary" id="save-edit-btn">Save Changes</button>
          </div>
        </form>
      </div>
    </div>

    <script>
      const API_BASE = 'http://localhost:5000/api/courses';

      const state = {
        courses: [],
      };

      const el = {
        banner: document.getElementById('banner'),
        form: document.getElementById('course-form'),
        name: document.getElementById('name'),
        description: document.getElementById('description'),
        targetDate: document.getElementById('target_date'),
        status: document.getElementById('status'),
        submitBtn: document.getElementById('submit-btn'),
        loading: document.getElementById('loading'),
        emptyState: document.getElementById('empty-state'),
        grid: document.getElementById('courses-grid'),
        refreshBtn: document.getElementById('refresh-btn'),
        editModal: document.getElementById('edit-modal'),
        editForm: document.getElementById('edit-form'),
        editId: document.getElementById('edit-id'),
        editName: document.getElementById('edit-name'),
        editDescription: document.getElementById('edit-description'),
        editTargetDate: document.getElementById('edit-target_date'),
        editStatus: document.getElementById('edit-status'),
        cancelEditBtn: document.getElementById('cancel-edit-btn'),
        saveEditBtn: document.getElementById('save-edit-btn'),
      };

      let bannerTimeout;
      function showBanner(message, type) {
        clearTimeout(bannerTimeout);
        el.banner.textContent = message;
        el.banner.className = `banner ${type}`;
        bannerTimeout = setTimeout(() => {
          el.banner.classList.add('hidden');
        }, 4000);
      }

      function setFieldError(prefix, message) {
        const target = document.getElementById(`${prefix}-error`);
        if (target) target.textContent = message || '';
      }

      function clearFieldErrors(prefix) {
        ['name', 'description', 'target_date'].forEach((field) => {
          setFieldError(prefix ? `${prefix}-${field}` : field, '');
        });
      }

      function validateFields({ name, description, target_date }, prefix) {
        let valid = true;
        clearFieldErrors(prefix);

        if (!name || !name.trim()) {
          setFieldError(prefix ? `${prefix}-name` : 'name', 'Course name is required.');
          valid = false;
        }
        if (!description || !description.trim()) {
          setFieldError(prefix ? `${prefix}-description` : 'description', 'Description is required.');
          valid = false;
        }
        if (!target_date) {
          setFieldError(prefix ? `${prefix}-target_date` : 'target_date', 'Target date is required.');
          valid = false;
        }
        return valid;
      }

      function statusClass(status) {
        if (status === 'Completed') return 'status-completed';
        if (status === 'In Progress') return 'status-in-progress';
        return 'status-not-started';
      }

      function formatDate(value) {
        if (!value) return '—';
        const d = new Date(value);
        if (isNaN(d.getTime())) return value;
        return d.toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' });
      }

      function escapeHtml(str) {
        const div = document.createElement('div');
        div.textContent = str ?? '';
        return div.innerHTML;
      }

      async function apiRequest(url, options) {
        let response;
        try {
          response = await fetch(url, options);
        } catch (networkError) {
          throw new Error(
            'Could not reach the course server. Make sure the API is running and reachable, then try again.'
          );
        }

        if (!response.ok) {
          let message = `Request failed (status ${response.status}).`;
          try {
            const body = await response.json();
            if (body && body.message) message = body.message;
          } catch (_) {
            // response had no JSON body, keep default message
          }
          throw new Error(message);
        }

        if (response.status === 204) return null;
        try {
          return await response.json();
        } catch (_) {
          return null;
        }
      }

      function setLoading(isLoading) {
        el.loading.classList.toggle('hidden', !isLoading);
        if (isLoading) {
          el.grid.classList.add('hidden');
          el.emptyState.classList.add('hidden');
        }
      }

      function render() {
        el.grid.innerHTML = '';

        if (state.courses.length === 0) {
          el.grid.classList.add('hidden');
          el.emptyState.classList.remove('hidden');
          return;
        }

        el.emptyState.classList.add('hidden');
        el.grid.classList.remove('hidden');

        state.courses.forEach((course) => {
          const card = document.createElement('div');
          card.className = 'course-card';
          card.innerHTML = `
            <div class="course-card-top">
              <h3 class="course-name">${escapeHtml(course.name)}</h3>
              <span class="status-badge ${statusClass(course.status)}">${escapeHtml(course.status)}</span>
            </div>
            <p class="course-description">${escapeHtml(course.description)}</p>
            <div class="course-meta">
              <span>Target date: ${formatDate(course.target_date)}</span>
              <span>Created: ${formatDate(course.created_at)}</span>
            </div>
            <div class="course-actions">
              <button class="btn btn-secondary edit-btn">Edit</button>
              <button class="btn btn-danger remove-btn">Remove</button>
            </div>
          `;
          card.querySelector('.edit-btn').addEventListener('click', () => openEditModal(course));
          card.querySelector('.remove-btn').addEventListener('click', () => handleDelete(course.id));
          el.grid.appendChild(card);
        });
      }

      async function fetchCourses() {
        setLoading(true);
        try {
          const data = await apiRequest(API_BASE);
          state.courses = Array.isArray(data) ? data : data?.courses ?? [];
          render();
        } catch (err) {
          state.courses = [];
          render();
          showBanner(err.message, 'error');
        } finally {
          setLoading(false);
        }
      }

      el.form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const payload = {
          name: el.name.value.trim(),
          description: el.description.value.trim(),
          target_date: el.targetDate.value,
          status: el.status.value,
        };

        if (!validateFields(payload)) return;

        el.submitBtn.disabled = true;
        el.submitBtn.textContent = 'Adding…';
        try {
          await apiRequest(API_BASE, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload),
          });
          el.form.reset();
          el.status.value = 'Not Started';
          showBanner('Course added successfully.', 'success');
          await fetchCourses();
        } catch (err) {
          showBanner(err.message, 'error');
        } finally {
          el.submitBtn.disabled = false;
          el.submitBtn.textContent = 'Add Course';
        }
      });

      function openEditModal(course) {
        el.editId.value = course.id;
        el.editName.value = course.name || '';
        el.editDescription.value = course.description || '';
        el.editTargetDate.value = course.target_date || '';
        el.editStatus.value = course.status || 'Not Started';
        clearFieldErrors('edit');
        el.editModal.classList.remove('hidden');
      }

      function closeEditModal() {
        el.editModal.classList.add('hidden');
      }

      el.cancelEditBtn.addEventListener('click', closeEditModal);
      el.editModal.addEventListener('click', (e) => {
        if (e.target === el.editModal) closeEditModal();
      });

      el.editForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const id = el.editId.value;
        const payload = {
          name: el.editName.value.trim(),
          description: el.editDescription.value.trim(),
          target_date: el.editTargetDate.value,
          status: el.editStatus.value,
        };

        if (!validateFields(payload, 'edit')) return;

        el.saveEditBtn.disabled = true;
        el.saveEditBtn.textContent = 'Saving…';
        try {
          await apiRequest(`${API_BASE}/${id}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload),
          });
          showBanner('Course updated successfully.', 'success');
          closeEditModal();
          await fetchCourses();
        } catch (err) {
          showBanner(err.message, 'error');
        } finally {
          el.saveEditBtn.disabled = false;
          el.saveEditBtn.textContent = 'Save Changes';
        }
      });

      async function handleDelete(id) {
        if (!confirm('Are you sure you want to remove this course?')) return;
        try {
          await apiRequest(`${API_BASE}/${id}`, { method: 'DELETE' });
          showBanner('Course removed.', 'success');
          await fetchCourses();
        } catch (err) {
          showBanner(err.message, 'error');
        }
      }

      el.refreshBtn.addEventListener('click', fetchCourses);

      fetchCourses();
    </script>
  </body>
</html>
